title: Plinth Standalone Compiler
description: A fork of GHC that compiles Plinth (Plutus Tx) to Plutus Core.

remote_theme: kitian616/jekyll-TeXt-theme

plugins:
  - jekyll-remote-theme
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jemoji

# Theme appearance: light skin + matching code highlighting
text_skin: default
highlight_theme: tomorrow

# Clean URLs without the .html extension
permalink: pretty

# Table of contents shown in the right-hand aside
toc:
  selectors: "h1,h2,h3"

# Apply the docs sidebar + in-page TOC to every page by default
defaults:
  - scope:
      path: ""
    values:
      layout: article
      sidebar:
        nav: docs
      aside:
        toc: true
      show_edit_on_github: false
      pageview: false
