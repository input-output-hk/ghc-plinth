<!-- Plinth logo: a white plinth/pedestal on the theme accent tile. Shadows the
     TeXt theme's default logo. Deliberately still the flat artwork from
     assets/images/favicon-source.svg rather than the 3D mark in _logo/: at the
     24px header size the rendered shading is invisible, and the SVG stays crisp
     at any pixel ratio. -->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     x="0px" y="0px" width="24px" height="24px" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#fc4d50"/>
  <g fill="#ffffff">
    <rect x="14" y="12" width="36" height="8"/>   <!-- cornice: top slab -->
    <rect x="22" y="20" width="20" height="26"/>  <!-- dado: shaft -->
    <rect x="8"  y="46" width="48" height="9"/>   <!-- plinth: base block -->
  </g>
</svg>
