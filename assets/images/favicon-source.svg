<!-- Flat master artwork for the plinth mark: a white pedestal on the theme
     accent tile (#fc4d50). This is the geometry the header logo
     (_includes/svg/logo.svg) and the Safari pinned tab still use, and the
     reference the 3D mark was matched against.

     The raster favicons are no longer rendered from this file -- they come from
     the POV-Ray scene in _logo/, via _logo/make-icons.py. Either way, do not
     edit the generated assets by hand. -->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#fc4d50"/>
  <g fill="#ffffff">
    <rect x="14" y="12" width="36" height="8"/>   <!-- cornice: top slab -->
    <rect x="22" y="20" width="20" height="26"/>  <!-- dado: shaft -->
    <rect x="8"  y="46" width="48" height="9"/>   <!-- plinth: base block -->
  </g>
</svg>
