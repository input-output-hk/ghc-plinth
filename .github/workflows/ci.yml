name: CI

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [master, ghc-9.6-plinth]
  workflow_dispatch:

jobs:
  cabal:
    name: ${{ matrix.os }} / ghc ${{ matrix.ghc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ghc: ['9.6.7']

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: "recursive"

    - name: Build uplc-ghc
      run: ./plinth-build.sh

    - name: Test uplc-ghc
      run: ./plinth-test.sh
